      const ledgerResponse = await backend('/api/ledger');
      state.transactions = (ledgerResponse.transactions || []).map((item, index) => ({ id: item.ref || `ledger-${index}`, userId: String(apiUser.id), type: item.amount >= 0 ? 'credit' : 'debit', amount: Number(item.amount), note: item.note, date: new Date(item.created_at).toLocaleString() }));

    function showToast(title, message = '', type = 'success') {
      const container = document.getElementById('toast-container');
      const id = 'toast_' + Date.now() + Math.random().toString(36).slice(2, 6);
      const colors = {
        success: 'border-brand-500 bg-white text-slate-900',
        error: 'border-red-500 bg-white text-slate-900',
        warning: 'border-amber-500 bg-white text-slate-900',
        info: 'border-sky-500 bg-white text-slate-900'
      };
      const iconBg = {
        success: 'bg-brand-100 text-brand-700',
        error: 'bg-red-100 text-red-700',
        warning: 'bg-amber-100 text-amber-700',
        info: 'bg-sky-100 text-sky-700'
      };
      const icons = { success: '✓', error: '!', warning: '⚠', info: 'i' };

      const el = document.createElement('div');
      el.id = id;
      el.className = `pointer-events-auto rounded-2xl border-l-4 ${colors[type]} shadow-lg border border-slate-200/80 p-3.5 flex items-start gap-3 fade-in`;
      el.innerHTML = `
        <div class="w-6 h-6 rounded-full ${iconBg[type]} font-bold text-xs flex items-center justify-center shrink-0 mt-0.5">${icons[type]}</div>
        <div class="flex-1 min-w-0">
          <div class="text-xs font-bold text-slate-900">${title}</div>
          ${message ? `<div class="text-xs text-slate-500 mt-0.5 leading-relaxed">${message}</div>` : ''}
        </div>
        <button onclick="document.getElementById('${id}')?.remove()" class="text-slate-400 hover:text-slate-600 text-xs">✕</button>
      `;
      container.appendChild(el);
      setTimeout(() => el.remove(), 4500);
    }

    function openModal(htmlContent) {
      const root = document.getElementById('modal-root');
      root.innerHTML = `
        <div class="bg-white rounded-2xl border border-slate-200 shadow-2xl max-w-lg w-full overflow-hidden fade-in" onclick="event.stopPropagation()">
          ${htmlContent}
        </div>
      `;
      root.classList.remove('hidden');
      root.classList.add('flex');
      root.onclick = closeModal;

    function closeModal() {
      const root = document.getElementById('modal-root');

    function copyTextFallback(text, label = 'Copied to clipboard') {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.style.position = 'fixed';
      textarea.style.opacity = '0';
      document.body.appendChild(textarea);
      textarea.select();
      try {
        document.execCommand('copy');
        showToast(label, text.slice(0, 48) + (text.length > 48 ? '...' : ''));
      } catch (err) {
        showToast('Copy failed', 'Please select and copy manually.', 'error');
      }
      document.body.removeChild(textarea);
    }

    function getStudioCreditCost() {
      const s = state.studio;
      const p = state.pricing;
      if (s.mainTab === 'motion') return Number(p.motion_control) || 30;
      if (s.mainTab === 'omni') return Number(p.omni_reference) || 25;

      const isFlash = s.model.includes('Flash');
      if (s.duration === '5s') return isFlash ? Number(p.flash_5s) : Number(p.pro_5s);
      if (s.duration === '15s') return isFlash ? Number(p.flash_15s) : Number(p.pro_15s);
      return isFlash ? Number(p.flash_10s) : Number(p.pro_10s);
    }

    // Studio Actions
    function selectCompatiblePriceRule() {
      const s = state.studio;
      const wantsTail = s.mainTab === 'standard' && s.subTab === 'first_last';
      const wantsText = s.mainTab === 'standard' && s.subTab === 'image_to_video' && studioFiles.images.length === 0;
      const wantedModel = s.mainTab === 'motion' ? '2.6' : s.model;
      const omniRule = s.mainTab === 'omni' ? getOmniPriceRule() : null;
      const rule = omniRule || klingPriceRules.find(item => item.enabled && item.model === wantedModel && Boolean(item.tailImage) === wantsTail && Boolean(item.motionControl) === (s.mainTab === 'motion') && (!wantsText || item.textToVideo) && (s.mainTab !== 'motion' || item.resolution === '720p'))
        || klingPriceRules.find(item => item.enabled && Boolean(item.tailImage) === wantsTail && Boolean(item.motionControl) === (s.mainTab === 'motion') && (!wantsText || item.textToVideo));
      if (rule) { s.model = rule.model; s.duration = `${rule.durationSeconds}s`; s.resolution = rule.resolution; s.audio = s.mainTab === 'omni' ? true : Boolean(rule.audio); if (rule.aspectRatio !== '*') s.aspectRatio = rule.aspectRatio; }
    }
    function setStudioMainTab(tab) {
      state.studio.mainTab = tab;
      selectCompatiblePriceRule();
      saveState();
      renderPage();
    }
    function setStudioSubTab(sub) {
      state.studio.subTab = sub;
      selectCompatiblePriceRule();
      saveState();
      renderPage();
    }
    function updateStudioSetting(key, val) {
      const s = state.studio;
      const next = { model: s.model, durationSeconds: Number.parseInt(s.duration, 10), resolution: s.resolution, audio: Boolean(s.audio), tailImage: s.mainTab === 'standard' && s.subTab === 'first_last', motionControl: s.mainTab === 'motion' };
      if (key === 'audio') next.audio = Boolean(val);
      if (key === 'model') next.model = val;
      if (key === 'duration') next.durationSeconds = Number.parseInt(val, 10);
      if (key === 'resolution') next.resolution = val;
      if (['audio','model','duration','resolution'].includes(key) && !klingPriceRules.some(rule => rule.enabled && rule.model === next.model && rule.durationSeconds === next.durationSeconds && rule.resolution === next.resolution && Boolean(rule.audio) === next.audio && Boolean(rule.tailImage) === next.tailImage && Boolean(rule.motionControl) === next.motionControl)) {

        if (backup) { s.duration = `${backup.durationSeconds}s`; s.resolution = backup.resolution; s.audio = Boolean(backup.audio); }
      }
      s[key] = val;

    function handleStudioFileUpload(e, kind) {
      const files = Array.from(e.target.files || []);
      if (!files.length) return;
      if (kind === 'image') { studioFiles.images = files; state.studio.uploadedImageName = files.map(file => file.name).join(', '); }
      else if (kind === 'omni') {
        if (files.length > 10) { e.target.value = ''; return showToast('Too many reference photos', 'Omni Reference accepts up to 10 images.', 'error'); }
        studioFiles.omni = files; state.studio.omniRefsCount = files.length;
      } else if (kind === 'motion' || kind === 'character') {
        studioFiles[kind] = files;
        if (kind === 'motion') state.studio.motionVideoName = files.map(file=>file.name).join(', ');
        if (kind === 'character') state.studio.characterPhotoName = files.map(file=>file.name).join(', ');
      } else {
        studioFiles[kind] = files[0];
        if (kind === 'first') { state.studio.firstFrameSet = true; state.studio.firstFrameName = files[0].name; }
        if (kind === 'last') { state.studio.lastFrameSet = true; state.studio.lastFrameName = files[0].name; }
      }
      renderPage();
      showToast('File attached', `${files.length} file(s) ready for upload.`);
    }
    async function uploadStudioFiles(files) {
      const uploadedKeys = [];
      for (let offset = 0; offset < files.length; offset += 50) {
        const group = files.slice(offset, offset + 50);
        const initialized = await backend('/api/uploads/init', { method: 'POST', body: JSON.stringify({ files: group.map(file => ({ filename: file.name, contentType: file.type || (file.name.toLowerCase().endsWith('.mov') ? 'video/quicktime' : 'application/octet-stream'), sizeBytes: file.size })) }) });
        const items = initialized.items || [];
        if (items.length !== group.length) throw new Error('The upload service did not return a URL for every selected file.');
        await Promise.all(items.map(async (item, index) => {
          const uploaded = await fetch(item.uploadUrl, { method: 'PUT', headers: { 'Content-Type': item.contentType }, body: group[index] });
          if (!uploaded.ok) throw new Error(`Upload failed for ${group[index].name} (${uploaded.status}).`);
        }));
        await backend('/api/uploads/complete', { method: 'POST', body: JSON.stringify({ items: items.map(item => ({ objectKey: item.objectKey })) }) });
        uploadedKeys.push(...items.map(item => item.objectKey));
      }
      return uploadedKeys;
    }

    async function submitVideoGeneration() {
      const s = state.studio;
      const prompts = s.prompts.map(value => value.trim()).filter(Boolean);
      if (!prompts.length) return showToast('Add a prompt', 'Enter at least one video description.', 'error');
      const settings = klingSettings();
      let uploadFiles = [];
      let quoteBody = { settings, imageCount: 1 };
      let mode = s.mainTab;
      if (mode === 'standard' && s.subTab === 'first_last') {
        if (!studioFiles.first || !studioFiles.last) return showToast('Add both frames', 'Choose the first-frame and last-frame images before continuing.', 'error');
        if (prompts.length !== 1) return showToast('One prompt required', 'First frame–last frame mode creates one video per quote.', 'error');
        mode = 'first_last'; uploadFiles = [studioFiles.first, studioFiles.last]; quoteBody = { settings, imageCount: 1, tailImage: true };
      } else if (s.mainTab === 'motion') {
        if (!studioFiles.motion.length || !studioFiles.character.length) return showToast('Add the motion inputs', 'Choose at least one sample video and one character photo.', 'error');
        if (studioFiles.motion.length > 1 && studioFiles.character.length > 1) return showToast('Choose one input group', 'Select one sample video with multiple characters, or one character with multiple sample videos.', 'error');
        if (studioFiles.motion.length > 100 || studioFiles.character.length > 100) return showToast('Too many motion inputs', 'Motion Control accepts at most 100 videos or character photos per batch.', 'error');
        if (prompts.length !== 1) return showToast('One prompt required', 'Motion Control creates one job for this sample and character.', 'error');
        mode = 'motion'; settings.model = '2.6'; settings.resolution = '720p';
        uploadFiles = [...studioFiles.motion, ...studioFiles.character];
        quoteBody = { settings, imageCount: studioFiles.character.length, motionVideoCount: studioFiles.motion.length, motionControl: true };
      } else if (s.mainTab === 'omni') {
        if (!studioFiles.omni.length) return showToast('Add reference photos', 'Choose 1 to 10 real reference photos.', 'error');
        mode = 'omni'; uploadFiles = studioFiles.omni;
        quoteBody = { settings, imageCount: studioFiles.omni.length, omniReference: true, promptCount: prompts.length, prompts };
      } else {
        const images = studioFiles.images;
        if (images.length > 100) return showToast('Too many images', 'Choose up to 100 images per batch.', 'error');
        if (!images.length) {
          const rule = klingPriceRules.find(item => item.enabled && item.model === settings.model && item.durationSeconds === settings.durationSeconds && item.resolution === settings.resolution && Boolean(item.audio) === Boolean(settings.audio) && item.textToVideo && !item.motionControl && !item.tailImage);
          if (!rule) return showToast('Prompt-only generation unavailable for this model', 'Choose a model and duration that the live API marks as Text-to-Video capable.', 'error');
          quoteBody = { settings, imageCount: 1, textToVideo: true, ...(prompts.length > 1 ? { promptCount: prompts.length, prompts } : {}) };
          mode = 'text_to_video';
        } else {
      if (images.length > 1 && prompts.length !== 1) return showToast('Use one prompt for image batches', 'Several images with several prompts is not supported by the current video service. Use one image with multiple prompts instead.', 'error');
          uploadFiles = images;
          quoteBody = images.length === 1 && prompts.length > 1
            ? { settings, imageCount: 1, jobType: 'image_to_video', promptCount: prompts.length, prompts }
            : { settings, imageCount: images.length };
        }
      }
      try {
        const objectKeys = await uploadStudioFiles(uploadFiles);
        const quote = await backend('/api/quote', { method: 'POST', body: JSON.stringify(quoteBody) });
        pendingKlingRequest = { quote, settings, prompts, objectKeys, mode, motionCount: s.mainTab === 'motion' ? studioFiles.motion.length : 0, keepSampleAudio: Boolean(s.keepSampleAudio), framing: s.framing };
        const count = Number(quote.jobCount || quote.imageCount || prompts.length || 1);
        openModal(`<div class="p-6 space-y-4"><h3 class="text-lg font-bold">Confirm video generation</h3><p class="text-sm text-slate-600">${count} video(s), estimated provider charge <strong>${Number(quote.totalAmount).toLocaleString()} ${quote.currency || 'VND'}</strong>.</p><p class="text-xs text-slate-500">This job will use ${Number(quote.creditsRequired).toLocaleString()} Zahid AI credits. Your linked generation wallet is charged separately.</p><div class="flex justify-end gap-2"><button onclick="closeModal(); pendingKlingRequest=null" class="px-4 py-2 rounded-xl border text-sm">Cancel</button><button onclick="confirmKlingGeneration()" class="px-4 py-2 rounded-xl bg-brand-600 text-white text-sm font-bold">Create and charge</button></div></div>`);
      } catch (error) { const message = mode === 'omni' && error.code === 'NO_PRICE_RULE' ? 'Omni Reference has no active price rule on the linked video account. No credits or wallet balance were charged.' : error.message; showToast('Could not get quote', message, 'error'); }
    }

    async function confirmKlingGeneration() {
      const pending = pendingKlingRequest;
      if (!pending) return;
      pendingKlingRequest = null;
      closeModal();
      const body = { quoteId: pending.quote.quoteId, settings: pending.settings, expectedTotal: pending.quote.totalAmount };
      if (pending.mode === 'motion') { const characterKeys = pending.objectKeys.slice(pending.motionCount); const videoKeys = pending.objectKeys.slice(0, pending.motionCount); Object.assign(body, { jobType: 'motion_control', imageKeys: characterKeys, ...(videoKeys.length === 1 ? { motionVideoObjectKey: videoKeys[0] } : { motionVideoObjectKeys: videoKeys }), motionCharacterOrientation: pending.framing === 'Half body' ? 'HALF' : 'FULL', keepOriginalSound: pending.keepSampleAudio, prompt: pending.prompts[0] }); }
      else if (pending.mode === 'omni') Object.assign(body, { jobType: 'omni_reference', omniReference: true, imageKeys: pending.objectKeys, prompts: pending.prompts });
      else if (pending.mode === 'first_last') Object.assign(body, { imageKeys: [pending.objectKeys[0]], endFrameKey: pending.objectKeys[1], prompt: pending.prompts[0] });
      else if (pending.mode === 'text_to_video') Object.assign(body, { jobType: 'text_to_video', ...(pending.prompts.length > 1 ? { prompts: pending.prompts } : { prompt: pending.prompts[0] }) });
      else if (pending.prompts.length > 1) Object.assign(body, { jobType: 'image_to_video', imageKeys: [pending.objectKeys[0]], prompts: pending.prompts });
      else Object.assign(body, { imageKeys: pending.objectKeys, prompt: pending.prompts[0] });
      try {
        const created = await backend('/api/batches', { method: 'POST', headers: { 'Idempotency-Key': crypto.randomUUID() }, body: JSON.stringify(body) });
        for (const [index, job] of (created.jobs || []).entries()) {
          const jobId = job.jobId || job.id;
          const item = { id: `K-${jobId}`, videoId: String(jobId), remoteJobId: jobId, userId: getCurrentUser().id, model: pending.settings.model, mode: pending.mode === 'motion' ? 'Motion Control' : pending.mode === 'omni' ? 'Omni Reference' : pending.mode === 'first_last' ? 'First and Last Frame' : pending.mode === 'text_to_video' ? 'Text to Video' : 'Image to Video', duration: `${pending.settings.durationSeconds}s`, aspectRatio: pending.settings.aspectRatio, resolution: pending.settings.resolution, creditsUsed: Math.floor(Number(created.creditsCharged || pending.quote.creditsRequired) / (created.jobs.length || 1)), status: 'processing', createdAt: new Date().toLocaleString(), dayBucket: 'today', prompt: pending.prompts[index] || pending.prompts[0], videoUrl: '' };
          state.batches.unshift(item);
          pollKlingJob(item);
        }
        state.studio.lastUsedPrompt = pending.prompts[0];
        const activeUser = state.users.find(user => String(user.id) === String(getCurrentUser().id));
        if (activeUser && Number.isFinite(Number(created.creditsRemaining))) activeUser.credits = Number(created.creditsRemaining);
        showToast('Video generation started', `${(created.jobs || []).length} job(s) created. Charge: ${Number(created.creditsCharged ?? pending.quote.creditsRequired).toLocaleString()} credits.`);
        navigate('batches');
      } catch (error) { showToast('Generation failed', error.message, 'error'); }
    }

    async function pollKlingJob(item) {
      const terminal = new Set(['success', 'failed', 'canceled']);
      while (true) {
        try {
          const job = await backend(`/api/jobs/${item.remoteJobId}`);
          item.model = job.model || item.model;
          item.etaMs = job.etaMs || 0;
          item.status = job.status === 'success' ? 'completed' : job.status === 'failed' ? 'failed' : job.status === 'canceled' ? 'canceled' : 'processing';
          item.error = job.errorCode || '';
          if (job.status === 'success') { const video = await backend(`/api/jobs/${item.remoteJobId}/video-url`); item.videoUrl = video.url || ''; }
          item.pollError = '';
          saveState();
          if (state.activeRoute === 'batches' || state.activeRoute === 'videos' || state.activeRoute === 'home') renderPage();
          if (terminal.has(job.status)) break;
        } catch (error) {
          item.pollError = error.message;
          saveState();
          if (state.activeRoute === 'batches' || state.activeRoute === 'videos') renderPage();
          console.warn('Kling job status check failed:', error.message);
        }
        // Check at the fast end of the upstream docs' 5–10 second polling range.
        // This updates visible progress sooner; the provider controls render time.
        await new Promise(resolve => setTimeout(resolve, 5000));
      }
    }

                  <div class="text-[11px] text-slate-400">Transaction ID: <code class="text-slate-700 font-semibold">${req.txId}</code> • ${req.createdAt}</div>
                </div>

                ${req.status === 'pending' ? `
                  <div class="flex items-center gap-2">
                    <button onclick="handleCreditRequestAction('${req.id}', 'rejected')" class="px-3.5 py-2 rounded-xl border border-red-200 hover:bg-red-50 text-red-600 text-xs font-semibold cursor-pointer">
                      Reject
                    </button>
                    <button onclick="handleCreditRequestAction('${req.id}', 'approved')" class="px-4 py-2 rounded-xl bg-brand-600 hover:bg-brand-700 text-white text-xs font-bold shadow-2xs cursor-pointer">
                      ✓ Approve & Add ${req.credits} Credits
                    </button>
                  </div>
                ` : ''}
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function renderAdminPricingTab() {
      return `
        <div class="max-w-3xl bg-white rounded-2xl border border-slate-200/90 p-6 space-y-5 shadow-2xs">
          <div><h2 class="text-base font-bold text-slate-900">Credit Pricing & Payment Methods</h2><p class="text-xs text-slate-500 mt-1">The backend gets live video prices. Set how many Zahid AI credits equal one VND, your payment currency, and the methods you accept.</p></div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-xs">
            <label class="block font-semibold text-slate-700">Credits per 1 VND<input id="admin-credit-rate" type="number" min="0.000001" step="any" value="${Number(state.settings.creditsPerVnd || 1)}" class="w-full mt-1 px-3 py-2.5 rounded-xl border border-slate-200"></label>
            <label class="block font-semibold text-slate-700">Payment currency<input id="admin-currency" maxlength="6" value="${state.settings.currency || 'PKR'}" class="w-full mt-1 px-3 py-2.5 rounded-xl border border-slate-200"></label>
            <label class="block font-semibold text-slate-700 sm:col-span-2">Accepted payment methods (comma separated)<input id="admin-methods" value="${(state.settings.paymentMethods || []).join(', ')}" class="w-full mt-1 px-3 py-2.5 rounded-xl border border-slate-200"></label>
          </div>
          <button onclick="saveAdminPricing()" class="px-5 py-2.5 rounded-xl bg-brand-600 hover:bg-brand-700 text-white text-xs font-bold">Save Pricing & Payment Methods</button>
        </div>`;
    }

    function renderAdminApiTab() {
      const cfg = state.settings;
      const wallet = cfg.apiWallet;
      return `
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
          <div class="lg:col-span-7 bg-white rounded-2xl border border-slate-200/90 p-6 space-y-4 shadow-2xs">
          <div class="flex items-center justify-between"><div><h2 class="text-base font-bold text-slate-900">Main Video Account</h2><p class="text-xs text-slate-500 mt-1">Video jobs use the private server key and charge your linked provider wallet.</p></div><button onclick="testUpstreamApiConnection()" class="px-3 py-2 rounded-xl bg-brand-50 text-brand-700 text-xs font-bold">Refresh wallet</button></div>
            <div class="rounded-xl border border-slate-200 bg-slate-50 p-4"><div class="text-xs text-slate-500">Live API wallet balance</div><div class="mt-1 text-xl font-extrabold text-slate-900">${wallet ? `${Number(wallet.balance).toLocaleString()} ${wallet.currency || 'VND'}` : 'Unavailable'}</div><div class="text-xs text-slate-500 mt-1">${wallet ? `Held reserve: ${Number(wallet.heldReserve || 0).toLocaleString()} ${wallet.currency || 'VND'} · updated ${wallet.updatedAt || 'recently'}` : (cfg.apiWalletError || 'Select Refresh wallet to load your live balance.')}</div></div>
            <div class="rounded-xl bg-amber-50 border border-amber-200 p-3 text-xs text-amber-900">The API key stays on the server in <code>KLING_API_KEY</code>; it is never sent to visitors’ browsers.</div>
          </div>
          <div class="lg:col-span-5 bg-white rounded-2xl border border-slate-200/90 p-6 space-y-4">
            <h2 class="text-base font-bold text-slate-900">Manual Payment Instructions</h2><p class="text-xs text-slate-500">Users see these instructions when requesting credits. Approve their request after confirming payment.</p>
            <label class="block text-xs font-semibold text-slate-700">Instructions<textarea id="cfg_pay" rows="5" class="w-full mt-1 px-3 py-2 rounded-xl border border-slate-200">${cfg.paymentInstructions || ''}</textarea></label>
            <h3 class="pt-2 text-base font-bold text-slate-900">Homepage Social Links</h3><p class="text-xs text-slate-500">Add your public profile URLs. Only links you fill in will appear in the footer.</p>
            ${[['tiktok','TikTok'],['youtube','YouTube'],['facebook','Facebook'],['instagram','Instagram']].map(([key,label])=>`<label class="block text-xs font-semibold text-slate-700">${label} profile URL<input id="social-${key}" type="url" placeholder="https://www.${key}.com/yourprofile" value="${escapePublicText(cfg.socialLinks?.[key] || '')}" class="w-full mt-1 px-3 py-2 rounded-xl border border-slate-200"></label>`).join('')}
            <button onclick="saveAdminSettings()" class="px-5 py-2.5 rounded-xl bg-brand-600 hover:bg-brand-700 text-white text-xs font-bold">Save Payment &amp; Social Links</button>
          </div>
        </div>`;
    }

    // Admin Actions
    async function adminToggleUserApproval(userId) {
      const u = state.users.find(x => String(x.id) === String(userId)); if (!u) return;
      try { await backend(`/api/admin/users/${userId}`, { method: 'PATCH', body: JSON.stringify({ status: u.approved ? 'suspended' : 'active' }) }); await refreshDatabaseState(); renderShell(); renderPage(); showToast(u.approved ? 'User Suspended' : 'User Approved', `${u.email} account status updated.`); }
      catch (error) { showToast('Could not update user', error.message, 'error'); }
    }

    async function adminPromoteUser(userId) {
      const user = state.users.find(item => String(item.id) === String(userId));
      if (!user || user.isAdmin) return;
      try {
        await backend(`/api/admin/users/${userId}/promote`, { method: 'POST', body: JSON.stringify({}) });
        await refreshDatabaseState(); renderShell(); renderPage();
        showToast('Administrator added', `${user.email} now has administrator access.`);
      } catch (error) { showToast('Could not add administrator', error.message, 'error'); }
    }

    async function adminAdjustCredits(userId, delta) {
      const u = state.users.find(x => String(x.id) === String(userId)); if (!u) return;
      try { await backend(`/api/admin/users/${userId}/credits`, { method: 'POST', body: JSON.stringify({ amount: Number(delta), note: 'Admin credit adjustment' }) }); await refreshDatabaseState(); renderShell(); renderPage(); showToast('Credits Updated', `${u.email} balance updated.`); }
      catch (error) { showToast('Could not update credits', error.message, 'error'); }
    }

    function openCustomCreditModal(userId) {
      const u = state.users.find(x => x.id === userId);
      if (!u) return;
      openModal(`
        <div class="p-6 space-y-4">
          <h3 class="text-lg font-bold text-slate-900">Adjust Credits for ${u.email}</h3>
          <p class="text-xs text-slate-500">Current Balance: <strong>${u.credits.toLocaleString()} Credits</strong>. Enter a positive number to add or negative (e.g. -100) to deduct.</p>
          <input id="custom-credit-input" type="number" value="500" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm font-bold" />
          <div class="flex justify-end gap-2">
            <button onclick="closeModal()" class="px-4 py-2 rounded-xl border border-slate-200 text-xs font-semibold">Cancel</button>
            <button onclick="const val = Number(document.getElementById('custom-credit-input').value || 0); closeModal(); adminAdjustCredits('${u.id}', val);" class="px-4 py-2 rounded-xl bg-brand-600 text-white text-xs font-bold">Apply Credits</button>
          </div>
        </div>
      `);
    }

    async function handleCreditRequestAction(reqId, decision) {
      try { await backend(`/api/admin/credit-requests/${reqId}`, { method: 'POST', body: JSON.stringify({ decision }) }); await refreshDatabaseState(); renderShell(); renderPage(); showToast(decision === 'approved' ? 'Top-Up Approved' : 'Top-Up Rejected', `Payment request ${reqId} ${decision}.`); }
      catch (error) { showToast('Could not review request', error.message, 'error'); }
    }

    async function saveAdminPricing() {
      try { await backend('/api/admin/settings', { method: 'PUT', body: JSON.stringify({ creditsPerVnd: Number(document.getElementById('admin-credit-rate').value), currency: document.getElementById('admin-currency').value, paymentMethods: document.getElementById('admin-methods').value, paymentInstructions: state.settings.paymentInstructions || '' }) }); await refreshDatabaseState(); renderShell(); renderPage(); showToast('Pricing Saved', 'Credit conversion and accepted payment methods updated.'); }
      catch (error) { showToast('Could not save pricing', error.message, 'error'); }
    }

    function saveAdminPackages() {
      state.packages.forEach((pkg, i) => {
        pkg.name = document.getElementById(`pkg_name_${i}`).value || pkg.name;
        pkg.credits = Number(document.getElementById(`pkg_cred_${i}`).value) || pkg.credits;
        pkg.priceLabel = document.getElementById(`pkg_price_${i}`).value || pkg.priceLabel;
      });
      saveState();
      showToast('Packages Updated', 'User top-up packages updated successfully.');
    }

    async function saveAdminSettings() {
      try { const socialLinks = Object.fromEntries(['tiktok','youtube','facebook','instagram'].map(key => [key, document.getElementById(`social-${key}`).value.trim()])); await backend('/api/admin/settings', { method: 'PUT', body: JSON.stringify({ creditsPerVnd: Number(state.settings.creditsPerVnd || 1), currency: state.settings.currency || 'PKR', paymentMethods: (state.settings.paymentMethods || ['Bank transfer']).join(', '), paymentInstructions: document.getElementById('cfg_pay').value, socialLinks }) }); await refreshDatabaseState(); renderShell(); renderPage(); showToast('Settings Saved', 'Payment instructions and homepage social links were updated.'); }
      catch (error) { showToast('Could not save settings', error.message, 'error'); }
    }

    async function testUpstreamApiConnection() {
      try {
        const overview = await backend('/api/admin/overview');
        state.settings.apiWallet = overview.wallet;
        state.settings.apiWalletError = '';
        state.settings.apiConnected = true;
        state.adminOverview = overview;
        renderPage();
        showToast('Live wallet connected', `${Number(overview.wallet.balance).toLocaleString()} ${overview.wallet.currency} available in your video account.`);
      } catch (error) {
        state.settings.apiWallet = null;
        state.settings.apiWalletError = `${error.message}${error.code ? ` (${error.code})` : ''}`;
        state.settings.apiConnected = false;
        renderPage();
        showToast('Wallet refresh failed', state.settings.apiWalletError, 'error');
      }
    }

    function resetDemoData() { showToast('Demo data removed', 'This live website uses database records.'); }

    // =========================================================================
    // INTERACTIVE MODALS (Top-Up, Preview Player, Signup Simulator, Switcher)
    // =========================================================================
    function openTopUpModal() {
      const methods = state.settings.paymentMethods || [];
      if (!methods.length || !state.settings.paymentInstructions) return showToast('Payments not configured', 'Ask the site administrator to add payment instructions.', 'warning');
      openModal(`<div class="p-6 space-y-4"><div class="flex items-center justify-between"><h3 class="text-lg font-bold text-slate-900">Request Credits</h3><button onclick="closeModal()" class="text-slate-400">✕</button></div><div class="p-3 rounded-xl bg-brand-50 border border-brand-200 text-xs text-brand-800 whitespace-pre-wrap">${state.settings.paymentInstructions}</div><div class="grid grid-cols-2 gap-3"><label class="text-xs font-bold">Credits requested<input id="topup-credits" type="number" min="1" required class="w-full mt-1 px-3 py-2 rounded-xl border"></label><label class="text-xs font-bold">Amount paid (${state.settings.currency})<input id="topup-amount" type="number" min="0.01" step="any" required class="w-full mt-1 px-3 py-2 rounded-xl border"></label><label class="text-xs font-bold">Payment method<select id="topup-method" class="w-full mt-1 px-3 py-2 rounded-xl border">${methods.map(m=>`<option>${m}</option>`).join('')}</select></label><label class="text-xs font-bold">Transaction reference<input id="topup-txid" required class="w-full mt-1 px-3 py-2 rounded-xl border"></label></div><div class="rounded-xl bg-amber-50 p-3 text-xs leading-5 text-amber-900">After you submit, WhatsApp opens with your request details. Attach your payment screenshot in that chat and press Send so the admin can review it.</div><div class="flex justify-end gap-2"><button onclick="closeModal()" class="px-4 py-2 rounded-xl border text-xs">Cancel</button><button onclick="submitCreditTopUpRequest()" class="px-4 py-2 rounded-xl bg-brand-600 text-white text-xs font-bold">Submit &amp; open WhatsApp</button></div></div>`);
    }

    async function submitCreditTopUpRequest() {
      const whatsappTab = window.open('about:blank', '_blank');
      const credits = Number(document.getElementById('topup-credits').value);
      const paidAmount = Number(document.getElementById('topup-amount').value);
      const paymentMethod = document.getElementById('topup-method').value;
      const transactionRef = document.getElementById('topup-txid').value.trim();
      try {
        const result = await backend('/api/credit-requests', { method: 'POST', body: JSON.stringify({ credits, paidAmount, paymentMethod, transactionRef }) });
        await refreshDatabaseState(); closeModal(); renderShell();
        const message = `Zahid AI credit request #${result.id}\nAccount: ${getCurrentUser().email}\nCredits requested: ${credits.toLocaleString()}\nAmount paid: ${paidAmount} ${state.settings.currency}\nPayment method: ${paymentMethod}\nTransaction reference: ${transactionRef}\nI am attaching my payment screenshot for manual approval.`;
        if (whatsappTab) whatsappTab.location.href = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`;
        showToast('Credit Request Submitted', `Request #${result.id} is pending admin approval. Attach your payment screenshot in WhatsApp and send the message.`);
      } catch (error) { if (whatsappTab) whatsappTab.close(); showToast('Could not submit request', error.message, 'error'); }
    }

    function openVideoPreviewModal(batchId) {
      const b = state.batches.find(x => x.id === batchId);
      if (!b) return;
      openModal(`
        <div class="overflow-hidden">
          <div class="p-4 border-b border-slate-100 flex items-center justify-between">
            <div class="flex items-center gap-2">
              <span class="text-sm font-bold text-slate-900">Batch ${b.id} • Video ${b.videoId}</span>
              <span class="text-[11px] font-semibold px-2 py-0.5 rounded bg-brand-50 text-brand-700">${b.model}</span>
            </div>
            <button onclick="closeModal()" class="text-slate-400 hover:text-slate-700">✕</button>
          </div>
          <div class="bg-slate-950 aspect-video flex items-center justify-center p-3 relative">
            ${b.videoUrl ? `<video controls class="max-h-full max-w-full" src="${b.videoUrl}"></video>` : `<div class="text-center"><div class="text-sm font-bold text-white">${b.status === 'completed' ? 'Video is ready to download' : `Job status: ${b.status}`}</div><p class="text-xs text-slate-300 max-w-md mt-2">${b.error || b.prompt}</p></div>`}
          </div>
          <div class="p-4 bg-white flex items-center justify-between">
            <span class="text-xs text-slate-500">Aspect: <strong>${b.aspectRatio}</strong> • Cost: <strong>${b.creditsUsed} Credits</strong></span>
            <button onclick="triggerVideoDownload('${b.videoId}', '${b.id}')" class="px-4 py-2 rounded-xl bg-brand-600 hover:bg-brand-700 text-white text-xs font-bold cursor-pointer">
              Download MP4
            </button>
          </div>
        </div>
      `);
    }

    function triggerVideoDownload(videoId, batchId) {
      const item = state.batches.find(x => x.id === batchId);
      if (!item?.videoUrl) return showToast('Video not ready', 'The secure video link is not available yet.', 'warning');
      const a = document.createElement('a');
      a.href = item.videoUrl;
      a.target = '_blank';
      a.rel = 'noopener';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      showToast('Opening video download', `Your video result for job ${videoId}.`);
    }

    function openNewSignupDemoModal() { showToast('Real sign-ups', 'Users create their own accounts from the sign-in screen.', 'info'); }

    function createSimulatedUser() { showToast('Unavailable', 'Demo accounts are disabled.', 'warning'); }

    function openAccountSwitcherModal() { logoutApp(); }

    function switchActiveUser(userId) {
      state.activeUserId = userId;
      saveState();
      renderShell();
      renderPage();
      const u = getCurrentUser();
      showToast('Switched Account', `Now viewing Zahid AI as ${u.email}`);
    }

    function openChangePasswordModal() {
      openModal(`
        <div class="p-6 space-y-4">
          <h3 class="text-lg font-bold text-slate-900">Change Account Password</h3>
          <input type="password" placeholder="New password" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-xs" />
          <div class="flex justify-end gap-2">
            <button onclick="closeModal()" class="px-4 py-2 rounded-xl border border-slate-200 text-xs font-semibold">Cancel</button>
            <button onclick="closeModal(); showToast('Password Updated', 'Your account security credentials were saved.');" class="px-4 py-2 rounded-xl bg-brand-600 text-white text-xs font-bold">Save Password</button>
          </div>
        </div>
      `);
    }

    function openHelpPaymentModal() {
      openModal(`
        <div class="p-6 space-y-3">
          <div class="flex items-center justify-between">
            <h3 class="text-lg font-bold text-slate-900">Help & Credit Payment Guide</h3>
            <button onclick="closeModal()" class="text-slate-400 hover:text-slate-700">✕</button>
          </div>
          <p class="text-xs text-slate-600 leading-relaxed">${state.settings.paymentInstructions}</p>
          <div class="flex justify-end pt-2">
            <button onclick="closeModal(); openTopUpModal();" class="px-4 py-2 rounded-xl bg-brand-600 text-white text-xs font-bold">Request Credits Now</button>
          </div>
        </div>
      `);
    }

    function openUserGuideModal() {
      openModal(`
        <div class="p-6 space-y-3">
          <div class="flex items-center justify-between">
            <h3 class="text-lg font-bold text-slate-900">Zahid AI — Kling Video User Guide</h3>
            <button onclick="closeModal()" class="text-slate-400 hover:text-slate-700">✕</button>
          </div>
          <ul class="text-xs text-slate-600 space-y-2 list-disc pl-4 leading-relaxed">
            <li><strong>Kling 4.0 Flash:</strong> Fastest generation speed with high visual consistency—ideal for multi-shot storytelling.</li>
            <li><strong>Motion Control:</strong> Upload a sample motion video (2.5s–13s) + character photo to transfer exact body movement.</li>
            <li><strong>Omni Reference:</strong> Combine up to 10 reference images into a single cohesive scene.</li>
          </ul>
          <div class="flex justify-end pt-2">
            <button onclick="closeModal()" class="px-4 py-2 rounded-xl bg-slate-900 text-white text-xs font-bold">Got it</button>
          </div>
        </div>
      `);
    }

    // =========================================================================
    // MAIN PAGE ROUTER
    // =========================================================================
    function renderPage() {
      const vp = document.getElementById('app-viewport');
      if (state.activeRoute === 'admin' && getCurrentUser().role !== 'Owner / Admin') { state.activeRoute = 'home'; state.adminSubTab = 'users'; }
      switch (state.activeRoute) {
        case 'home': vp.innerHTML = renderHomePage(); break;
        case 'create': vp.innerHTML = renderCreateVideoPage(); break;
        case 'batches': vp.innerHTML = renderBatchesPage(); break;
        case 'videos': vp.innerHTML = renderMyVideosPage(); break;
        case 'account': vp.innerHTML = renderAccountPage(); break;
        case 'developer': vp.innerHTML = renderDeveloperPage(); break;
        case 'admin': vp.innerHTML = renderAdminPage(); break;
        default: vp.innerHTML = renderHomePage();
      }
    }

    // Close notification popover when clicking outside
    document.addEventListener('click', (e) => {
      const pop = document.getElementById('notif-popover');
      if (pop && !pop.classList.contains('hidden') && !e.target.closest('#notif-popover') && !e.target.closest('button[onclick="toggleNotifications()"]')) {
        pop.classList.add('hidden');
      }
    });

    // Boot the original studio behind real server authentication.
    window.addEventListener('DOMContentLoaded', async () => {
      const [prices, publicSettings] = await Promise.all([backend('/api/prices').catch(() => []), backend('/api/public-settings').catch(() => null)]);
      publicPriceRules = prices;
      if (publicSettings?.socialLinks) state.settings.socialLinks = publicSettings.socialLinks;
      try { const session = await backend('/api/me'); csrfToken = session.csrf; await enterApplication(); }
      catch { showPublicLanding(); }
    });
  </script>
