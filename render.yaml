services:
  - type: web
    name: zahid-ai
    runtime: docker
    plan: 0.5c-512mb
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DATA_DIR
        value: /app/data
      - key: KLING_API_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
    disk:
      name: zahid-ai-data
      mountPath: /app/data
      sizeGB: 1
